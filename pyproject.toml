[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faceoff"
version = "1.9.5"
description = "MRI defacing tool using ANTs registration (your own install, Docker, or Apptainer) to an MNI152 template"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "rich>=13,<15",
    "rich-click>=1.9,<2",
    "numpy>=1.26",
    "nibabel>=5",
    "pillow>=10",
]

[project.scripts]
faceoff = "faceoff.cli:cli"
FaceOff = "faceoff.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["faceoff"]
# faceoff/data is created by bundle_template.py and is not tracked by git.
artifacts = ["faceoff/data/"]

[tool.hatch.build.hooks.custom]
path = "bundle_template.py"
