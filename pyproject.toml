[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faceoff"
version = "1.9.8"
description = "MRI defacing tool using ANTs registration (your own install, Docker, or Apptainer) to an MNI152 template"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "rich>=13,<15",
    "rich-click>=1.9,<2",
    "numpy>=1.26",
    "nibabel>=5",
    "pillow>=10",
]

[project.scripts]
faceoff = "faceoff.cli:cli"
FaceOff = "faceoff.cli:cli"

[dependency-groups]
dev = ["mypy>=2", "pytest>=9", "ruff==0.16.6"]  # ruff pinned: its formatter output changes between releases

[tool.hatch.build.targets.wheel]
packages = ["faceoff"]
# faceoff/data is created by bundle_template.py and is not tracked by git.
artifacts = ["faceoff/data/"]

[tool.hatch.build.hooks.custom]
path = "bundle_template.py"

[tool.ruff]
line-length = 100

[tool.mypy]
exclude = ["testdata/"]  # git-ignored scratch folder

[[tool.mypy.overrides]]
module = "hatchling.*"  # the build backend, not installed in the development environment
ignore_missing_imports = true
