name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests are cancelled by a newer push; a run on master may be tagging a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type-check
        run: uv run mypy .

  test:
    name: Test Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Test
        run: uv run --python ${{ matrix.python }} pytest

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The wheel build downloads the five template files from Zenodo and bundles them.
      - name: Build
        run: uv build --no-sources --out-dir dist

      - name: Check what is inside
        run: python3 scripts/check_dist.py dist

      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          clean/bin/faceoff --version
          clean/bin/python - <<'PY'
          from faceoff.template import Template
          from faceoff.template_files import is_complete

          folder = Template.default().folder
          assert "site-packages" in str(folder), folder
          assert is_complete(folder), folder
          PY

  tag-release:
    name: Tag a version bump
    # A new version in pyproject.toml, merged to master and green, is released: the tag starts
    # the image, the GitHub release (which Zenodo archives) and PyPI.
    needs: [quality, test, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag and start the release workflows if pyproject.toml's version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"
          # A tag pushed with the default token does not start other workflows'
          # `on: push: tags` (GitHub's safeguard against loops), so start them explicitly.
          gh workflow run release.yml --ref "${tag}"
          gh workflow run container.yml --ref "${tag}"
